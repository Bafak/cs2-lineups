<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADE VAULT</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f; --surface: #111418; --surface2: #181d24;
    --border: #1e2530; --border2: #2a3340;
    --accent: #e8a020; --accent2: #c47a10;
    --text: #d0d8e4; --text-dim: #6a7a8e;
    --smoke: #4a9edd; --flash: #f0e040; --molly: #e84030; --he: #60c060;
    --font-main: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-main); min-height:100vh; overflow-x:hidden; }

  header { display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:52px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
  .logo { font-family:var(--font-mono); font-size:18px; color:var(--accent); letter-spacing:3px; text-transform:uppercase; }
  .logo span { color:var(--text-dim); font-size:12px; margin-left:8px; letter-spacing:1px; }
  .header-right { display:flex; gap:8px; align-items:center; }
  .btn-admin { background:transparent; border:1px solid var(--border2); color:var(--text-dim); padding:6px 14px; font-family:var(--font-main); font-size:13px; font-weight:600; letter-spacing:1px; cursor:pointer; text-transform:uppercase; transition:all 0.15s; }
  .btn-admin:hover { border-color:var(--accent); color:var(--accent); }
  .save-status { font-family:var(--font-mono); font-size:11px; letter-spacing:1px; }
  .save-status.saving { color:var(--text-dim); }
  .save-status.saved { color:#60c060; }
  .save-status.error { color:var(--molly); }

  /* DRAG AND DROP IMAGE UPLOAD */
  .dropzone { border:2px dashed var(--border2); padding:20px; text-align:center; cursor:pointer; transition:all 0.15s; position:relative; }
  .dropzone:hover, .dropzone.dragover { border-color:var(--accent); background:rgba(232,160,32,0.05); }
  .dropzone input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .dropzone-text { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:1px; pointer-events:none; }
  .dropzone-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dropzone-thumb { width:60px; height:60px; object-fit:cover; border:1px solid var(--border2); position:relative; }
  .dropzone-thumb-wrap { position:relative; display:inline-block; }
  .dropzone-thumb-remove { position:absolute; top:-4px; right:-4px; width:16px; height:16px; background:var(--molly); border:none; color:#fff; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .upload-progress { font-family:var(--font-mono); font-size:11px; color:var(--accent); margin-top:6px; }

  .app { display:flex; height:calc(100vh - 52px); }

  .sidebar { width:220px; min-width:220px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
  .sidebar-section { padding:16px; border-bottom:1px solid var(--border); }
  .sidebar-label { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
  .sidebar-label-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .sidebar-label-row .sidebar-label { margin-bottom:0; }
  .multi-toggle { background:transparent; border:1px solid var(--border2); color:var(--text-dim); padding:2px 8px; font-family:var(--font-mono); font-size:9px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.12s; }
  .multi-toggle:hover { border-color:var(--text-dim); color:var(--text); }
  .multi-toggle.active { color:var(--accent); border-color:var(--accent); background:rgba(232,160,32,0.08); }
  .map-list { display:flex; flex-direction:column; gap:2px; }
  .map-btn { background:transparent; border:none; color:var(--text-dim); padding:8px 10px; font-family:var(--font-main); font-size:15px; font-weight:600; cursor:pointer; text-align:left; border-left:2px solid transparent; transition:all 0.12s; display:flex; align-items:center; justify-content:space-between; }
  .map-btn:hover { color:var(--text); background:var(--surface2); }
  .map-btn.active { color:var(--accent); border-left-color:var(--accent); background:rgba(232,160,32,0.06); }
  .map-btn .count { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); background:var(--surface2); padding:1px 6px; border-radius:2px; }
  .map-btn.active .count { color:var(--accent); }

  .filter-list { display:flex; flex-direction:column; gap:2px; }
  .filter-btn { background:transparent; border:none; color:var(--text-dim); padding:7px 10px; font-family:var(--font-main); font-size:14px; font-weight:500; cursor:pointer; text-align:left; border-left:2px solid transparent; transition:all 0.12s; display:flex; align-items:center; gap:8px; }
  .filter-btn:hover { color:var(--text); background:var(--surface2); }
  .filter-btn.active { color:var(--text); border-left-color:var(--text-dim); background:var(--surface2); }
  .filter-btn .dot { width:6px; height:6px; border-radius:50%; background:var(--text-dim); flex-shrink:0; }
  .filter-btn.active .dot { background:var(--text); }
  .filter-btn.stage-new.active { color:#60c060; border-left-color:#60c060; }
  .filter-btn.stage-new.active .dot { background:#60c060; }
  .filter-btn.stage-refresh.active { color:#e8a020; border-left-color:#e8a020; }
  .filter-btn.stage-refresh.active .dot { background:#e8a020; }
  .filter-btn.stage-learnt.active { color:#6a7a8e; border-left-color:#6a7a8e; }
  .filter-btn.stage-learnt.active .dot { background:#6a7a8e; }

  .nade-filters { display:flex; flex-direction:column; gap:2px; }
  .nade-btn { background:transparent; border:none; color:var(--text-dim); padding:7px 10px; font-family:var(--font-main); font-size:14px; font-weight:600; cursor:pointer; text-align:left; border-left:3px solid transparent; transition:all 0.12s; display:flex; align-items:center; gap:10px; }
  .nade-btn:hover { color:var(--text); background:var(--surface2); }
  .nade-btn.active.smoke { color:#a0a0a0; border-left-color:#a0a0a0; background:rgba(160,160,160,0.12); }
  .nade-btn.active.flash { color:var(--flash); border-left-color:var(--flash); background:rgba(240,224,64,0.1); }
  .nade-btn.active.molly { color:var(--molly); border-left-color:var(--molly); background:rgba(232,64,48,0.12); }
  .nade-btn.active.he { color:#60c060; border-left-color:#60c060; background:rgba(96,192,96,0.12); }
  .nade-icon { width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { height:44px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:16px; }
  .topbar-info { font-family:var(--font-mono); font-size:12px; color:var(--text-dim); }
  .topbar-info strong { color:var(--accent); font-weight:normal; }
  .separator { width:1px; height:20px; background:var(--border2); }

  .map-area { flex:1; position:relative; overflow:hidden; background:#080a0d; display:flex; align-items:center; justify-content:center; }
  .map-placeholder { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .map-image-container { position:relative; display:inline-block; }
  .map-image { display:block; max-width:110%; max-height:calc((100vh - 52px - 44px) * 1.1); width:auto; height:auto; opacity:0.9; user-select:none; -webkit-user-drag:none; }
  .map-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:auto; }
  .map-overlay > * { pointer-events:auto; }

  /* DOTTED LINE between throw and land */
  .lineup-line { position:absolute; pointer-events:none; z-index:5; }

  /* THROW MARKER - hidden by default, shows when group expanded */
  .marker-throw { position:absolute; transform:translate(-50%,-50%); pointer-events:none; z-index:9; opacity:0; transition:opacity 0.15s; }
  .marker-throw.visible { opacity:1; }
  .marker-throw.clickable { pointer-events:all; cursor:pointer; }
  .marker-throw.clickable:hover { transform:translate(-50%,-50%) scale(1.3); filter:brightness(1.3); }
  .marker-throw.dimmed { opacity:0 !important; }
  .marker-land-inner { width:18px; height:18px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,0.4); box-shadow:0 0 8px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,0,0,0.5); }

  /* EXPANDED land marker - active state */
  .marker.expanded { z-index:25; }
  .marker.expanded .marker-inner { box-shadow:0 0 0 3px var(--accent), 0 0 16px rgba(232,160,32,0.6), 0 0 10px rgba(0,0,0,0.6); }

  /* DIMMED state - when one lineup is focused */
  .marker.dimmed { opacity:0.15; pointer-events:none; }
  .marker-land.dimmed { opacity:0.15; }

  /* HOVER PREVIEW POPUP */
  .hover-preview { position:absolute; z-index:50; pointer-events:none; background:var(--surface); border:1px solid var(--border2); box-shadow:0 8px 32px rgba(0,0,0,0.8); width:220px; overflow:hidden; transform:translate(-50%, calc(-100% - 16px)); transition:opacity 0.1s; }
  .hover-preview video { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  .hover-preview img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  .hover-preview-label { padding:6px 8px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ftm-text { font-family:var(--font-mono); font-size:32px; color:var(--molly); letter-spacing:4px; text-transform:uppercase; opacity:0.7; }
  .ftm-sub { font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:2px; }
  .no-map { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-dim); font-family:var(--font-mono); font-size:13px; letter-spacing:2px; }
  .no-map-icon { width:60px; height:60px; border:1px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:28px; opacity:0.4; }

  .marker { position:absolute; transform:translate(-50%,-50%); cursor:pointer; pointer-events:all; z-index:10; transition:transform 0.1s, filter 0.1s; }
  .marker:hover { transform:translate(-50%,-50%) scale(1.25); filter:brightness(1.3); z-index:20; }
  .marker-inner { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid rgba(255,255,255,0.15); box-shadow:0 0 10px rgba(0,0,0,0.6); position:relative; }
  .marker-inner::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:1px solid currentColor; opacity:0.3; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:0.3; } 50% { transform:scale(1.2); opacity:0.1; } }
  .marker.smoke .marker-inner { background:rgba(160,160,160,0.85); border-color:#a0a0a0; }
  .marker.flash .marker-inner { background:rgba(240,224,64,0.85); border-color:var(--flash); }
  .marker.molly .marker-inner { background:rgba(232,64,48,0.85); border-color:var(--molly); }
  .marker.he .marker-inner { background:rgba(40,120,220,0.85); border-color:#2878dc; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border2); width:75vw; max-width:75vw; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 24px 80px rgba(0,0,0,0.8); }

  .modal-header { padding:8px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; }
  .modal-header-left { flex:1; min-width:0; }
  .modal-title { font-size:15px; font-weight:700; letter-spacing:1px; color:var(--text); }
  .modal-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .modal-header-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .modal-body { overflow-y:auto; flex:1; display:flex; flex-direction:column; min-height:0; }
  .modal-view { display:flex; flex-direction:column; flex:1; min-height:0; }
  .modal-media { width:100%; background:#000; max-height:calc(82vh - 120px); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; flex-shrink:0; }
  .modal-media video, .modal-media img, .modal-media iframe { width:100%; height:100%; object-fit:contain; }
  .modal-media .no-media { color:var(--text-dim); font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-align:center; }
  .modal-footer-info { padding:8px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--border); flex-wrap:wrap; flex-shrink:0; }
  .stage-switcher { display:flex; gap:4px; }

  .badge { font-family:var(--font-mono); font-size:11px; padding:3px 8px; border:1px solid; text-transform:uppercase; letter-spacing:1px; }
  .badge.smoke { color:var(--smoke); border-color:var(--smoke); background:rgba(74,158,221,0.1); }
  .badge.flash { color:var(--flash); border-color:var(--flash); background:rgba(240,224,64,0.1); }
  .badge.molly { color:var(--molly); border-color:var(--molly); background:rgba(232,64,48,0.1); }
  .badge.he { color:var(--he); border-color:var(--he); background:rgba(96,192,96,0.1); }
  .badge.seg { color:var(--text-dim); border-color:var(--border2); }

  /* STAGE SWITCHER */
  .stage-switcher { display:flex; gap:4px; flex-shrink:0; }
  .stage-switch-btn { min-width:60px; padding:3px 10px; text-align:center; font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--border2); cursor:pointer; color:var(--text-dim); background:var(--surface2); transition:all 0.12s; white-space:nowrap; }
  .stage-switch-btn:hover { border-color:var(--text-dim); color:var(--text); }
  .stage-switch-btn.active-new { color:#60c060; border-color:#60c060; background:rgba(96,192,96,0.1); }
  .stage-switch-btn.active-refresh { color:#e8a020; border-color:#e8a020; background:rgba(232,160,32,0.1); }
  .stage-switch-btn.active-learnt { color:#6a7a8e; border-color:#6a7a8e; background:rgba(106,122,142,0.15); }

  .modal-close { background:transparent; border:1px solid var(--border2); color:var(--text-dim); width:32px; height:32px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.12s; }
  .modal-close:hover { border-color:var(--molly); color:var(--molly); }
  .btn-edit-modal { background:transparent; border:1px solid var(--border2); color:var(--text-dim); padding:0 12px; height:32px; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; transition:all 0.12s; white-space:nowrap; }
  .btn-edit-modal:hover { border-color:var(--accent); color:var(--accent); }
  .btn-delete-modal { background:transparent; border:1px solid var(--border2); color:var(--text-dim); padding:0 12px; height:32px; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; transition:all 0.12s; white-space:nowrap; }
  .btn-delete-modal:hover { border-color:var(--molly); color:var(--molly); }

  .modal-notes { font-size:14px; color:var(--text-dim); line-height:1.6; padding:10px 14px; background:var(--surface2); border-left:2px solid var(--border2); flex-shrink:0; }

  /* VIEW MODE */
  .modal-view { display:block; }
  .modal-edit { display:none; }
  .modal.editing .modal-view { display:none; }
  .modal.editing .modal-edit { display:block; }

  .modal-media { width:100%; background:#000; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; margin-bottom:12px; position:relative; overflow:hidden; }
  .modal-media video, .modal-media img, .modal-media iframe { width:100%; height:100%; object-fit:contain; }
  .modal-media .no-media { color:var(--text-dim); font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-align:center; }

  .gallery-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .gallery-counter { font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:1px; }
  .gallery-btns { display:flex; gap:6px; }
  .gallery-btn { background:transparent; border:1px solid var(--border2); color:var(--text-dim); width:32px; height:32px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all 0.12s; }
  .gallery-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .gallery-btn:disabled { opacity:0.3; cursor:default; }
  .gallery-dots { display:flex; gap:6px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .gallery-dot { width:8px; height:8px; border-radius:50%; background:var(--border2); cursor:pointer; transition:background 0.12s; border:none; padding:0; }
  .gallery-dot.active { background:var(--accent); }

  .modal-notes { font-size:15px; color:var(--text-dim); line-height:1.6; padding:12px; background:var(--surface2); border-left:2px solid var(--border2); }

  /* EDIT FORM inside modal */
  .edit-form { display:flex; flex-direction:column; gap:14px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-label { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; }
  .form-input, .form-select, .form-textarea { background:var(--surface2); border:1px solid var(--border2); color:var(--text); padding:8px 12px; font-family:var(--font-main); font-size:14px; outline:none; transition:border-color 0.12s; width:100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
  .form-select { cursor:pointer; }
  .form-textarea { resize:vertical; min-height:60px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .coord-hint { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:4px; }

  .media-type-toggle { display:flex; gap:0; }
  .media-type-btn { flex:1; padding:7px 0; text-align:center; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--border2); cursor:pointer; color:var(--text-dim); background:var(--surface2); transition:all 0.12s; }
  .media-type-btn:first-child { border-right:none; }
  .media-type-btn.active { color:var(--accent); border-color:var(--accent); background:rgba(232,160,32,0.08); }

  .image-url-list { display:flex; flex-direction:column; gap:6px; }
  .image-url-row { display:flex; gap:6px; align-items:center; }
  .image-url-row input { flex:1; }
  .btn-remove-img { background:transparent; border:1px solid var(--border2); color:var(--text-dim); width:30px; height:34px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.12s; }
  .btn-remove-img:hover { border-color:var(--molly); color:var(--molly); }
  .btn-add-img { background:transparent; border:1px dashed var(--border2); color:var(--text-dim); padding:6px 12px; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; width:100%; transition:all 0.12s; margin-top:4px; }
  .btn-add-img:hover { border-color:var(--accent); color:var(--accent); }

  .bounce-toggle { background:transparent; border:1px solid var(--border2); color:var(--text-dim); padding:7px 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-align:left; transition:all 0.12s; display:flex; align-items:center; gap:8px; flex:1; }
  .bounce-toggle:hover { border-color:var(--text-dim); color:var(--text); }
  .bounce-toggle.active { color:var(--accent); border-color:var(--accent); background:rgba(232,160,32,0.15); font-weight:700; }
  .bounce-toggle-icon { font-size:14px; }
  .bounce-row { display:flex; gap:8px; align-items:center; }
  .bounce-count-wrap { display:flex; align-items:center; gap:6px; border:1px solid var(--accent); padding:4px 8px; background:rgba(232,160,32,0.08); flex-shrink:0; }
  .bounce-count-btn { background:transparent; border:none; color:var(--accent); font-size:16px; cursor:pointer; padding:0 4px; line-height:1; }
  .bounce-count-btn:hover { color:#fff; }
  .bounce-count-val { font-family:var(--font-mono); font-size:14px; color:var(--accent); min-width:16px; text-align:center; }

  /* BOUNCE MARKER on map */
  .marker-bounce { position:absolute; transform:translate(-50%,-50%) rotate(45deg); pointer-events:none; z-index:8; }
  .marker-bounce-inner { width:12px; height:12px; border:2px solid rgba(255,255,255,0.7); background:rgba(255,255,255,0.2); box-shadow:0 0 6px rgba(0,0,0,0.6); }

  .coord-picker-area { position:relative; width:100%; max-width:600px; margin:4px auto 0; background:#000; border:1px solid var(--border2); cursor:crosshair; overflow:hidden; }
  .coord-picker-area img { width:100%; display:block; opacity:0.8; pointer-events:none; user-select:none; }

<script>
const MAPS = [
  { id:'mirage', label:'Mirage' }, { id:'inferno', label:'Inferno' },
  { id:'nuke', label:'Nuke' }, { id:'ancient', label:'Ancient' },
  { id:'anubis', label:'Anubis' }, { id:'cache', label:'Cache' },
  { id:'dust2', label:'Dust2' },
];
const FTM_MAPS = ['dust2'];
const MAP_RADAR_IMGS = {
  mirage:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_mirage_radar_psd.png',
  inferno:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_inferno_radar_psd.png',
  nuke:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_nuke_radar_psd.png',
  ancient:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_ancient_radar_psd.png',
  anubis:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_anubis_radar_psd.png',
  cache:'https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_cache_radar_psd.png',
};
const SEGMENTS = ['standard','execute','instant_smokes','retake'];
const SEG_LABELS = { standard:'Standard', execute:'Execute', instant_smokes:'Instant smokes', retake:'Retake' };
const STAGES = ['new','refresh','learnt'];
const STAGE_LABELS = { new:'New', refresh:'Refresh', learnt:'Learnt' };

// ============================================================
// GITHUB API CONFIG - token is loaded from config.js
// ============================================================
const GITHUB_OWNER = 'Bafak';
const GITHUB_REPO = 'cs2-nade-vault';
const LINEUPS_PATH = 'lineups.json';
const IMAGES_PATH = 'images/lineups';

async function githubRequest(method, path, body) {
  const res = await fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + path, {
    method,
    headers: {
      'Authorization': 'Bearer ' + GITHUB_TOKEN,
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error('GitHub API error: ' + res.status + ' ' + await res.text());
  return res.json();
}

let lineupsSha = null; // SHA needed for updates

async function loadLineupsFromGitHub() {
  try {
    const data = await githubRequest('GET', LINEUPS_PATH);
    lineupsSha = data.sha;
    const raw = atob(data.content.replace(/\n/g,''));
    if (!raw || raw.trim() === '') return [];
    try {
      const json = JSON.parse(raw);
      return migrateLineups(Array.isArray(json) ? json : []);
    } catch(e2) {
      return [];
    }
  } catch(e) {
    console.warn('Could not load from GitHub, using localStorage fallback:', e);
    return migrateLineups(JSON.parse(localStorage.getItem('nadeVaultLineups') || '[]'));
  }
}

async function saveData() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(lineups, null, 2))));
  // If SHA is null, try to fetch it first
  if (!lineupsSha) {
    try {
      const existing = await githubRequest('GET', LINEUPS_PATH);
      lineupsSha = existing.sha;
    } catch(e) {
      // File doesn't exist yet - that's fine, create it
    }
  }
  const body = { message: 'Update lineups', content };
  if (lineupsSha) body.sha = lineupsSha;
  try {
    showSaveStatus('saving');
    const res = await githubRequest('PUT', LINEUPS_PATH, body);
    lineupsSha = res.content.sha;
    localStorage.setItem('nadeVaultLineups', JSON.stringify(lineups));
    showSaveStatus('saved');
  } catch(e) {
    console.error('GitHub save failed, saved to localStorage only:', e);
    localStorage.setItem('nadeVaultLineups', JSON.stringify(lineups));
    showSaveStatus('error');
  }
}

async function uploadImageToGitHub(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      const ext = file.name.split('.').pop();
      const filename = IMAGES_PATH + '/' + Date.now() + '.' + ext;
      try {
        const res = await githubRequest('PUT', filename, {
          message: 'Upload image ' + file.name,
          content: base64,
        });
        // Use GitHub API to get authenticated download URL for private repo
        const fileData = await githubRequest('GET', filename);
        resolve(fileData.download_url);
      } catch(e) { reject(e); }
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showSaveStatus(status) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  el.className = 'save-status ' + status;
  el.textContent = status === 'saving' ? 'SAVING...' : status === 'saved' ? 'SAVED ✓' : 'SAVE ERROR';
  if (status !== 'saving') setTimeout(() => { el.textContent = ''; el.className = 'save-status'; }, 2000);
}

function migrateLineups(data) {
  return data.filter(l => SEGMENTS.includes(l.segment) || l.segment == null).map(l => {
    if (!l.segment || !SEGMENTS.includes(l.segment)) l.segment = 'standard';
    if (!STAGES.includes(l.stage)) l.stage = 'new';
    if (!l.mediaType) { l.mediaType = 'video'; l.video = l.media || ''; l.images = []; delete l.media; }
    if (!l.bounces) l.bounces = [];
    return l;
  });
}

let lineups = [];
let selectedMap = null;
let activeNadeTypes = new Set(['smoke']);
let multiNadeMode = false;
let activeSegments = new Set([...SEGMENTS]);
let activeStages = new Set([...STAGES]);
let adminPickedX = null, adminPickedY = null, adminPickedLX = null, adminPickedLY = null, adminPickedBX = null, adminPickedBY = null;
let adminBounce = false;
let adminBounceCount = 1;
let adminBouncePoints = []; // array of {x,y} for each bounce point

function toggleAdminBounce() {
  adminBounce = !adminBounce;
  const btn = document.getElementById('adminBounceToggle');
  btn.classList.toggle('active', adminBounce);
  btn.querySelector('.bounce-toggle-icon').textContent = adminBounce ? '◆' : '◇';
  document.getElementById('adminBounceCountWrap').style.display = adminBounce ? 'flex' : 'none';
  adminBouncePoints = [];
  updateAdminPickerLabel();
  updateAdminMapPreview();
}

function changeAdminBounceCount(delta) {
  adminBounceCount = Math.max(1, Math.min(3, adminBounceCount + delta));
  document.getElementById('adminBounceCount').textContent = adminBounceCount;
  adminBouncePoints = [];
  updateAdminPickerLabel();
  updateAdminMapPreview();
}

function updateAdminPickerLabel() {
  const label = document.getElementById('adminPickerLabel');
  if (!adminBounce) {
    label.textContent = 'POSITION ON MAP - 1st = LAND, 2nd = THROW';

let focusedLineupId = null;
let expandedGroupKey = null; // group that's currently expanded

const GROUP_TOLERANCE = 2; // % tolerance for grouping land positions

function groupKey(mapId, type, lx, ly) {
  return mapId + ':' + type + ':' + Math.round(lx / GROUP_TOLERANCE) + ':' + Math.round(ly / GROUP_TOLERANCE);
}

function findExistingGroupLand(mapId, type, lx, ly) {
  for (const l of lineups) {
    if (l.map !== mapId || l.lx == null || l.type !== type) continue;
    if (Math.abs(l.lx - lx) <= GROUP_TOLERANCE && Math.abs(l.ly - ly) <= GROUP_TOLERANCE) {
      return { lx: l.lx, ly: l.ly };
    }
  }
  return null;
}

function renderMarkers() {
  const overlay = document.getElementById('markerOverlay');
  if (!overlay) return; overlay.innerHTML = '';
  if (!selectedMap || FTM_MAPS.includes(selectedMap)) return;

  const visible = lineups.filter(l => l.map === selectedMap && activeNadeTypes.has(l.type) && activeSegments.has(l.segment) && activeStages.has(l.stage || 'new'));

  const container = document.getElementById('mapImageContainer');
  const oldSvg = container.querySelector('.lines-svg');
  if (oldSvg) oldSvg.remove();
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','lines-svg');
  svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible;';
  container.insertBefore(svg, overlay);

  // group lineups by land position
  const groups = {};
  visible.forEach(l => {
    const hasLand = l.lx != null && l.ly != null;
    const lx = hasLand ? l.lx : l.x;
    const ly = hasLand ? l.ly : l.y;
    const key = groupKey(l.map, l.type, lx, ly);
    if (!groups[key]) groups[key] = { lx, ly, type: l.type, lineups: [] };
    groups[key].lineups.push(l);
  });

  Object.entries(groups).forEach(([key, group]) => {
    const isExpanded = expandedGroupKey === key;
    const isDimmed = expandedGroupKey && !isExpanded;

    // dominant type = most common type in group, or first
    const typeCount = {};
    group.lineups.forEach(l => { typeCount[l.type] = (typeCount[l.type] || 0) + 1; });
    const dominantType = Object.entries(typeCount).sort((a,b) => b[1]-a[1])[0][0];

    // LAND MARKER for the group
    const landMarker = document.createElement('div');
    landMarker.className = 'marker ' + dominantType + (isDimmed ? ' dimmed' : '') + (isExpanded ? ' expanded' : '');
    landMarker.style.left = group.lx + '%';
    landMarker.style.top = group.ly + '%';
    landMarker.innerHTML = '<div class="marker-inner"><img src="' + getNadeImg(dominantType) + '" width="9" height="9" style="object-fit:contain;filter:brightness(1.3)"></div>';

    landMarker.onclick = (e) => {
      e.stopPropagation();
      if (expandedGroupKey === key) {
        expandedGroupKey = null;
      } else {
        expandedGroupKey = key;
      }
      renderMarkers();
    };
    overlay.appendChild(landMarker);

    // dotted line - throw → (bounce →) land
    if (isExpanded) {
      group.lineups.forEach(l => {
        if (l.lx == null) return;

        const bounces = l.bounces && l.bounces.length ? l.bounces : (l.bx != null ? [{x:l.bx, y:l.by}] : []);
        const hasBounce = bounces.length > 0;

        if (hasBounce) {
          // throw → bounce(s) → land
          const pts = [[l.x, l.y], ...bounces.map(b => [b.x, b.y]), [group.lx, group.ly]];
          for (let i = 0; i < pts.length - 1; i++) {
            const seg = document.createElementNS('http://www.w3.org/2000/svg','line');
            seg.setAttribute('x1', pts[i][0] + '%'); seg.setAttribute('y1', pts[i][1] + '%');
            seg.setAttribute('x2', pts[i+1][0] + '%'); seg.setAttribute('y2', pts[i+1][1] + '%');
            seg.setAttribute('stroke', 'rgba(255,255,255,0.5)');
            seg.setAttribute('stroke-width', '1.5');
            seg.setAttribute('stroke-dasharray', '5,4');
            svg.appendChild(seg);
          }
          // no bounce diamond markers on the main map - just the lines
        } else {
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1', l.x + '%'); line.setAttribute('y1', l.y + '%');
          line.setAttribute('x2', group.lx + '%'); line.setAttribute('y2', group.ly + '%');
          line.setAttribute('stroke', 'rgba(255,255,255,0.5)');
          line.setAttribute('stroke-width', '1.5');
          line.setAttribute('stroke-dasharray', '5,4');
          svg.appendChild(line);
        }

        // throw marker - clickable
        const throwMarker = document.createElement('div');
        throwMarker.className = 'marker-throw visible clickable';
        throwMarker.style.left = l.x + '%';
        throwMarker.style.top = l.y + '%';
        throwMarker.innerHTML = '<div class="marker-land-inner"></div>';
        throwMarker.title = l.name;
        throwMarker.onclick = (e) => { e.stopPropagation(); openLineupModal(l); };
        overlay.appendChild(throwMarker);
      });
    }
  });

  // click on map background = collapse expanded group
  overlay.onclick = () => { if (expandedGroupKey) { expandedGroupKey = null; renderMarkers(); } };
}

function getNadeImg(type) { return { smoke:'images/source/Smoke2.png', flash:'images/source/Flashbang.png', molly:'images/source/Molotov.png', he:'images/source/HEgrenade.png' }[type] || 'images/source/Smoke2.png'; }

function showHoverPreview(e, lineup, marker) {
  hideHoverPreview();
  const preview = document.createElement('div');
  preview.className = 'hover-preview';
  preview.id = 'hoverPreview';

  let mediaHtml = '';
  if (lineup.mediaType === 'images' && lineup.images && lineup.images.length > 0) {
    mediaHtml = '<img src="' + lineup.images[0] + '" alt="preview">';
  } else if (lineup.video) {
    const ytMatch = lineup.video.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) {
      mediaHtml = '<img src="https://img.youtube.com/vi/' + ytMatch[1] + '/mqdefault.jpg" alt="preview">';
    } else if (lineup.video.match(/\.(mp4|webm)$/i)) {
      mediaHtml = '<video src="' + lineup.video + '" autoplay muted loop playsinline></video>';
    }
  }

  if (!mediaHtml) return;
  preview.innerHTML = mediaHtml + '<div class="hover-preview-label">' + lineup.name + '</div>';

  // position relative to marker
  const container = document.getElementById('mapImageContainer');
  const containerRect = container.getBoundingClientRect();
  const markerRect = marker.getBoundingClientRect();
  const left = markerRect.left - containerRect.left + markerRect.width / 2;
  const top = markerRect.top - containerRect.top;

  preview.style.left = left + 'px';
  preview.style.top = top + 'px';
  preview.style.position = 'absolute';

  container.appendChild(preview);
  hoverPreviewEl = preview;
}

function hideHoverPreview() {
  if (hoverPreviewEl) { hoverPreviewEl.remove(); hoverPreviewEl = null; }
  const existing = document.getElementById('hoverPreview');
  if (existing) existing.remove();
}

function updateTopbar() {
  const mapLabel = selectedMap ? (MAPS.find(m => m.id === selectedMap)?.label || selectedMap) : '-';
  document.getElementById('topbarMap').textContent = mapLabel;
  const count = selectedMap && !FTM_MAPS.includes(selectedMap) ? lineups.filter(l => l.map === selectedMap && activeNadeTypes.has(l.type) && activeSegments.has(l.segment) && activeStages.has(l.stage || 'new')).length : 0;
  document.getElementById('topbarCount').textContent = count;
  const allTypes = activeNadeTypes.size === 4, allSegs = activeSegments.size === SEGMENTS.length, allStages = activeStages.size === STAGES.length;
  let filterLabel = (allTypes && allSegs && allStages) ? 'ALL' : '';
  if (!filterLabel) {
    const parts = [];
    parts.push([...activeNadeTypes].join('+').toUpperCase());
    if (!allSegs) parts.push([...activeSegments].map(s => SEG_LABELS[s]).join('+'));
    if (!allStages) parts.push([...activeStages].map(s => STAGE_LABELS[s]).join('+'));
    filterLabel = parts.join(' / ');
  }
  document.getElementById('topbarFilter').textContent = filterLabel;
}

  document.getElementById('editCoordY').textContent = lineup.y != null ? lineup.y + '%' : '-';
  document.getElementById('editCoordLX').textContent = editPickedLX != null ? editPickedLX + '%' : '-';
  document.getElementById('editCoordLY').textContent = editPickedLY != null ? editPickedLY + '%' : '-';
  document.getElementById('editCoordBX').textContent = editPickedBX != null ? editPickedBX + '%' : '-';
  document.getElementById('editCoordBY').textContent = editPickedBY != null ? editPickedBY + '%' : '-';
}

function switchEditMediaType(type) {
  currentEditMediaType = type;
  document.getElementById('editMediaTypeVideo').classList.toggle('active', type === 'video');
  document.getElementById('editMediaTypeImages').classList.toggle('active', type === 'images');
  document.getElementById('editVideoField').style.display = type === 'video' ? 'flex' : 'none';
  document.getElementById('editImagesField').style.display = type === 'images' ? 'flex' : 'none';
}

function addEditImageRow() {
  const list = document.getElementById('editImageUrlList');
  if (list.children.length >= 10) return;
  const row = document.createElement('div');
  row.className = 'image-url-row';
  row.innerHTML = '<input class="form-input" type="text" placeholder="https://... image URL #' + (list.children.length+1) + '" /><button class="btn-remove-img" onclick="removeImageRow(this,\'editImageUrlList\')">&#10005;</button>';
  list.appendChild(row);
}

function editPickCoords(e) {
  const picker = document.getElementById('editCoordPicker');
  const rect = picker.getBoundingClientRect();
  const x = parseFloat(((e.clientX - rect.left) / rect.width * 100).toFixed(1));
  const y = parseFloat(((e.clientY - rect.top) / rect.height * 100).toFixed(1));

  if (editClickState === 'land') {
    editPickedLX = x; editPickedLY = y;
    document.getElementById('editCoordLX').textContent = x + '%';
    document.getElementById('editCoordLY').textContent = y + '%';
    let lch = document.getElementById('editCoordLandCrosshair');
    if (!lch) {
      lch = document.createElement('div');
      lch.id = 'editCoordLandCrosshair';
      lch.style.cssText = 'position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;background:rgba(232,160,32,0.2);';
      document.getElementById('editCoordPicker').appendChild(lch);
    }
    lch.style.left = x + '%'; lch.style.top = y + '%';
    editClickState = 'throw';

  } else if (editClickState === 'throw') {
    editPickedX = x; editPickedY = y;
    document.getElementById('editCoordX').textContent = x + '%';
    document.getElementById('editCoordY').textContent = y + '%';
    const ch = document.getElementById('editCoordCrosshair');
    if (ch) { ch.style.display = 'block'; ch.style.left = x + '%'; ch.style.top = y + '%'; }
    drawEditPickerLine();
    editClickState = editBounce ? 'bounce' : 'land';

  } else if (editClickState === 'bounce') {
    editPickedBX = x; editPickedBY = y;
    document.getElementById('editCoordBX').textContent = x + '%';
    document.getElementById('editCoordBY').textContent = y + '%';
    let bch = document.getElementById('editCoordBounceCrosshair');
    if (!bch) {
      bch = document.createElement('div');
      bch.id = 'editCoordBounceCrosshair';
      bch.style.cssText = 'position:absolute;transform:translate(-50%,-50%) rotate(45deg);width:12px;height:12px;border:2px solid rgba(255,255,255,0.8);pointer-events:none;background:rgba(255,255,255,0.2);';
      document.getElementById('editCoordPicker').appendChild(bch);
    }
    bch.style.left = x + '%'; bch.style.top = y + '%';
    drawEditPickerLine();
    // bounce
  editBounce = lineup.bx != null;
  editPickedBX = lineup.bx || null; editPickedBY = lineup.by || null;
  const editBounceBtn = document.getElementById('editBounceToggle');
  editBounceBtn.classList.toggle('active', editBounce);
  editBounceBtn.querySelector('.bounce-toggle-icon').textContent = editBounce ? '◆' : '◇';
  document.getElementById('editPickerLabel').textContent = editBounce ? 'POSITION ON MAP - 1st = LAND, 2nd = THROW, 3rd = BOUNCE' : 'POSITION ON MAP - 1st click = LAND, 2nd click = THROW';
  document.getElementById('editCoordBX').textContent = editPickedBX != null ? editPickedBX + '%' : '-';
  document.getElementById('editCoordBY').textContent = editPickedBY != null ? editPickedBY + '%' : '-';
  editClickState = 'land';
  }
}

function drawEditPickerLine() {
  if (editPickedX == null || editPickedLX == null) return;
  let svg = document.getElementById('editPickerLine');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.id = 'editPickerLine';
    svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;';
    document.getElementById('editCoordPicker').appendChild(svg);
  }
  if (editPickedBX != null) {
    svg.innerHTML = '<polyline points="' + editPickedX + '% ' + editPickedY + '%, ' + editPickedBX + '% ' + editPickedBY + '%, ' + editPickedLX + '% ' + editPickedLY + '%" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,4"/>';
  } else {
    svg.innerHTML = '<line x1="' + editPickedX + '%" y1="' + editPickedY + '%" x2="' + editPickedLX + '%" y2="' + editPickedLY + '%" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,4"/>';
  }
}

async function saveEdit() {
  const lineup = lineups.find(l => l.id === currentModalLineupId);
  if (!lineup) return;
  lineup.map = document.getElementById('editMap').value;
  lineup.type = document.getElementById('editType').value;
  lineup.name = document.getElementById('editName').value.trim();
  lineup.segment = document.getElementById('editSeg').value;
  lineup.stage = document.getElementById('editStage').value;
  lineup.notes = document.getElementById('editNotes').value.trim();
  lineup.mediaType = currentEditMediaType;
  if (currentEditMediaType === 'video') {
    lineup.video = document.getElementById('editVideo').value.trim();
    lineup.images = [];
  } else {
    lineup.images = [...editUploadedImages];
    lineup.video = '';
  }
  if (editPickedX !== null) { lineup.x = editPickedX; lineup.y = editPickedY; }
  if (editPickedLX !== null) { lineup.lx = editPickedLX; lineup.ly = editPickedLY; }
  if (editPickedBX !== null) { lineup.bx = editPickedBX; lineup.by = editPickedBY; }
  else if (!editBounce) { lineup.bx = null; lineup.by = null; }
  await saveData();
  renderMapList(); renderMarkers(); updateTopbar();
  document.getElementById('modalInner').classList.remove('editing');
  document.getElementById('editToggleBtn').textContent = 'EDIT';
  populateModalView(lineup);
}

function cancelEdit() {
  document.getElementById('modalInner').classList.remove('editing');
  document.getElementById('editToggleBtn').textContent = 'EDIT';
}

async function deleteCurrentLineup() {
  if (!currentModalLineupId) return;
  if (!confirm('Delete this lineup?')) return;
  lineups = lineups.filter(l => l.id !== currentModalLineupId);
  await saveData(); renderMapList(); renderMarkers(); updateTopbar(); closeModal();
}

// ---- ADD LINEUP PANEL ----

function switchAdminMediaType(type) {
  currentAdminMediaType = type;
  document.getElementById('adminMediaTypeVideo').classList.toggle('active', type === 'video');
  document.getElementById('adminMediaTypeImages').classList.toggle('active', type === 'images');
  document.getElementById('adminVideoField').style.display = type === 'video' ? 'flex' : 'none';
  document.getElementById('adminImagesField').style.display = type === 'images' ? 'flex' : 'none';
}

function addImageRow(listId) {
  const list = document.getElementById(listId);
  if (list.children.length >= 10) return;
  const row = document.createElement('div');
  row.className = 'image-url-row';
  row.innerHTML = '<input class="form-input" type="text" placeholder="https://... image URL #' + (list.children.length+1) + '" /><button class="btn-remove-img" onclick="removeImageRow(this,\'' + listId + '\')">&#10005;</button>';
  list.appendChild(row);
}

function removeImageRow(btn, listId) {
  const list = document.getElementById(listId);
  if (list.children.length <= 1) { btn.parentElement.querySelector('input').value = ''; return; }
  btn.parentElement.remove();
}

function openAdmin() { document.getElementById('adminPanel').classList.add('open'); }
function closeAdmin() { document.getElementById('adminPanel').classList.remove('open'); }
function closeAdminOutside(e) { if (e.target === document.getElementById('adminPanel')) closeAdmin(); }

function updateAdminMapPreview() {
  const mapId = document.getElementById('adminMap').value;
  const wrap = document.getElementById('adminMapPickerWrap');
  if (!mapId) { wrap.innerHTML = '<div class="map-select-hint">Select a map first</div>'; return; }
  const imgUrl = MAP_RADAR_IMGS[mapId];
  wrap.innerHTML = '<div class="coord-picker-area" id="coordPicker" onclick="pickCoords(event)"><img src="' + imgUrl + '" alt="map" draggable="false"><div class="coord-crosshair" id="coordCrosshair"></div></div>';
  adminPickedX = null; adminPickedY = null; adminPickedLX = null; adminPickedLY = null;
  adminBouncePoints = [];
  adminClickState = 'land';
  updateAdminCoordHint();
  updateAdminPickerLabel();
}

let adminClickState = 'land';

function pickCoords(e) {
  const picker = document.getElementById('coordPicker');
  const rect = picker.getBoundingClientRect();
  const x = parseFloat(((e.clientX - rect.left) / rect.width * 100).toFixed(1));
  const y = parseFloat(((e.clientY - rect.top) / rect.height * 100).toFixed(1));

  if (adminClickState === 'land') {
    adminPickedLX = x; adminPickedLY = y;
    placeCrosshair('coordLandCrosshair', x, y, '16px', 'var(--accent)', 'rgba(232,160,32,0.2)', false);
    drawPickerLine();
    adminClickState = adminBounce ? 'bounce0' : 'throw';

  } else if (adminClickState.startsWith('bounce')) {
    const idx = parseInt(adminClickState.replace('bounce',''));
    adminBouncePoints[idx] = {x, y};
    placeCrosshair('coordBounceCrosshair' + idx, x, y, '12px', 'rgba(255,255,255,0.8)', 'rgba(255,255,255,0.2)', true);
    const nextIdx = idx + 1;
    adminClickState = nextIdx < adminBounceCount ? 'bounce' + nextIdx : 'throw';

  } else if (adminClickState === 'throw') {
    adminPickedX = x; adminPickedY = y;
    const ch = document.getElementById('coordCrosshair');
    if (ch) { ch.style.display = 'block'; ch.style.left = x + '%'; ch.style.top = y + '%'; }
    drawPickerLine();
    adminClickState = 'land';
  }

  updateAdminCoordHint();
}

function placeCrosshair(id, x, y, size, borderColor, bg, rotate) {
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    const rot = rotate ? ' rotate(45deg)' : '';
    el.style.cssText = 'position:absolute;transform:translate(-50%,-50%)' + rot + ';width:' + size + ';height:' + size + ';border:2px solid ' + borderColor + ';border-radius:' + (rotate ? '0' : '50%') + ';pointer-events:none;background:' + bg + ';';
    document.getElementById('coordPicker').appendChild(el);
  }
  el.style.left = x + '%'; el.style.top = y + '%';
}

function updateAdminCoordHint() {
  const parts = ['LAND: ' + (adminPickedLX != null ? adminPickedLX + '%,' + adminPickedLY + '%' : '-')];
  adminBouncePoints.forEach((b, i) => parts.push('BOUNCE' + (adminBounceCount > 1 ? (i+1) : '') + ': ' + b.x + '%,' + b.y + '%'));
  parts.push('THROW: ' + (adminPickedX != null ? adminPickedX + '%,' + adminPickedY + '%' : '-'));
  document.getElementById('adminCoordHint').textContent = parts.join('  |  ');
}

function drawPickerLine() {
  let svg = document.getElementById('pickerLine');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.id = 'pickerLine';
    svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;';
    document.getElementById('coordPicker').appendChild(svg);
  }
  svg.innerHTML = '';

  // build all known points in order: throw → bounces (so far) → land (if set)
  const pts = [];
  if (adminPickedX != null) pts.push([adminPickedX, adminPickedY]);
  adminBouncePoints.forEach(b => pts.push([b.x, b.y]));
  if (adminPickedLX != null) pts.push([adminPickedLX, adminPickedLY]);

  // need at least 2 points to draw a line
  for (let i = 0; i < pts.length - 1; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', pts[i][0] + '%'); line.setAttribute('y1', pts[i][1] + '%');
    line.setAttribute('x2', pts[i+1][0] + '%'); line.setAttribute('y2', pts[i+1][1] + '%');
    line.setAttribute('stroke', 'rgba(255,255,255,0.5)');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-dasharray', '5,4');
    svg.appendChild(line);
  }
}

async function saveLineup() {
  const mapId = document.getElementById('adminMap').value;
  const type = document.getElementById('adminType').value;
  const name = document.getElementById('adminName').value.trim();
  const seg = document.getElementById('adminSeg').value;
  const stage = document.getElementById('adminStage').value;
  const notes = document.getElementById('adminNotes').value.trim();
  if (!mapId) { alert('Select a map.'); return; }
  if (!name) { alert('Enter a lineup name.'); return; }
  if (adminPickedLX === null) { alert('Click on the map first to set the land position.'); return; }
  if (adminPickedX === null) { alert('Click on the map a second time to set the throw position.'); return; }
  let mediaType = currentAdminMediaType, video = '', images = [];
  if (mediaType === 'video') {
    video = document.getElementById('adminVideo').value.trim();
  } else {
    images = [...adminUploadedImages];
    if (!images.length) { alert('Add at least one image, or switch to Video.'); return; }
  }

  // Check if there's an existing land position nearby - offer to group
  let finalLx = adminPickedLX, finalLy = adminPickedLY;
  const existing = findExistingGroupLand(mapId, type, adminPickedLX, adminPickedLY);
  if (existing) {
    const join = confirm('There is an existing land position nearby. Add this lineup to the existing group at this location?');
    if (join) { finalLx = existing.lx; finalLy = existing.ly; }
  }

  lineups.push({ id:'l'+Date.now(), map:mapId, type, name, segment:seg, stage, mediaType, video, images, x:adminPickedX, y:adminPickedY, lx:finalLx, ly:finalLy, bounces:adminBounce ? [...adminBouncePoints] : [], notes });
  await saveData();
  document.getElementById('adminMap').value = '';
  document.getElementById('adminName').value = '';
  document.getElementById('adminVideo').value = '';
  document.getElementById('adminNotes').value = '';
  resetDropzone('admin');
  adminPickedX = null; adminPickedY = null; adminPickedLX = null; adminPickedLY = null;
  adminBouncePoints = []; adminBounce = false; adminBounceCount = 1;
  adminClickState = 'land';
  document.getElementById('adminBounceToggle').classList.remove('active');
  document.getElementById('adminBounceToggle').querySelector('.bounce-toggle-icon').textContent = '◇';
  document.getElementById('adminBounceCountWrap').style.display = 'none';
  document.getElementById('adminBounceCount').textContent = '1';
  updateAdminPickerLabel();
  updateAdminMapPreview();
  renderMapList(); if (selectedMap === mapId) renderMarkers(); updateTopbar(); closeAdmin();
}

function renderExport() {
  document.getElementById('exportBox').textContent = JSON.stringify(lineups, null, 2);
}
function copyExport() {
  navigator.clipboard.writeText(JSON.stringify(lineups, null, 2)).then(() => {
    const btn = event.target; btn.textContent = 'COPIED!';
    setTimeout(() => btn.textContent = 'COPY JSON', 1500);
  });
}

// ---- IMAGE UPLOAD STATE ----
let adminUploadedImages = []; // array of URLs
let editUploadedImages = [];

function handleDragOver(e, id) {
  e.preventDefault();
  document.getElementById(id).classList.add('dragover');
}
function handleDragLeave(id) {
  document.getElementById(id).classList.remove('dragover');
}
function handleDrop(e, context) {
  e.preventDefault();
  const id = context + 'Dropzone';
  document.getElementById(id).classList.remove('dragover');
  uploadFiles([...e.dataTransfer.files], context);
}
function handleFileSelect(e, context) {
  uploadFiles([...e.target.files], context);
  e.target.value = '';
}

async function uploadFiles(files, context) {
  const imgFiles = files.filter(f => f.type.startsWith('image/')).slice(0, 10);
  if (!imgFiles.length) return;
  const progress = document.getElementById(context + 'UploadProgress');
  const preview = document.getElementById(context + 'ImagePreview');
  const arr = context === 'admin' ? adminUploadedImages : editUploadedImages;

  for (let i = 0; i < imgFiles.length; i++) {
    progress.textContent = 'UPLOADING ' + (i+1) + '/' + imgFiles.length + '...';
    try {
      const url = await uploadImageToGitHub(imgFiles[i]);
      arr.push(url);
      addThumbToPreview(preview, url, context, arr.length - 1);
    } catch(e) {
      progress.textContent = 'UPLOAD FAILED: ' + e.message;
      return;
    }
  }
  progress.textContent = 'UPLOADED ' + imgFiles.length + ' IMAGE' + (imgFiles.length > 1 ? 'S' : '') + ' ✓';
  setTimeout(() => { progress.textContent = ''; }, 2000);
}

function addThumbToPreview(container, url, context, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'dropzone-thumb-wrap';
  wrap.dataset.idx = idx;
  wrap.innerHTML = '<img class="dropzone-thumb" src="' + url + '"><button class="dropzone-thumb-remove" onclick="removeThumb(\'' + context + '\',' + idx + ')">✕</button>';
  container.appendChild(wrap);
}

function removeThumb(context, idx) {
  const arr = context === 'admin' ? adminUploadedImages : editUploadedImages;
  arr.splice(idx, 1);
  // re-render preview
  const preview = document.getElementById(context + 'ImagePreview');
  preview.innerHTML = '';
  arr.forEach((url, i) => addThumbToPreview(preview, url, context, i));
}

function resetDropzone(context) {
  if (context === 'admin') adminUploadedImages = [];
  else editUploadedImages = [];
  const preview = document.getElementById(context + 'ImagePreview');
  if (preview) preview.innerHTML = '';
  const progress = document.getElementById(context + 'UploadProgress');
  if (progress) progress.textContent = '';
}

function preloadEditImages(images) {
  editUploadedImages = [...images];
  const preview = document.getElementById('editImagePreview');
  if (!preview) return;
  preview.innerHTML = '';
  editUploadedImages.forEach((url, i) => addThumbToPreview(preview, url, 'edit', i));
}

init();
